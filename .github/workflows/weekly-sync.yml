name: Weekly Skills Sync & Catalog Rebuild

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Safety Snapshot
        run: |
          mkdir -p backups/github-actions/$(date +%Y%m%d)
          cp SKILLS_CATALOG.md README.md backups/github-actions/$(date +%Y%m%d)/ || true

      - name: Rebuild Catalog
        run: |
          python scripts/build_catalog.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Weekly automated skills vault sync: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          else
            echo "No upstream changes detected. Skipping commit."
          fi
